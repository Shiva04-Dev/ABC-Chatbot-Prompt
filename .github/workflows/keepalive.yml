name: Keep-alive ping (F1 tier)

# F1 App Service has no "Always On" option, so this pings /health to
# reduce (not guarantee against) cold starts from idling out.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -sf https://afribizconnect-c2dgdqfnbfdshsb7.centralus-01.azurewebsites.net/health
